# B2: zero-shot SAM 3, prompt "animal", per-frame masks merged (scripts/b2_sam3_zero_shot.py).
base: base.yaml
experiment: baselines
sam3:
  version: sam3             # sam3 (image checkpoint) | sam3.1 (detector from the video multiplex checkpoint)
  checkpoint: null          # explicit checkpoint path; null downloads `version` from Hugging Face
  prompt: animal
  score_threshold: 0.5      # instance masks kept when their score is at least this
  oracle_species_prompts: false   # true = prompt with GT species names (leaks labels, report apart)
