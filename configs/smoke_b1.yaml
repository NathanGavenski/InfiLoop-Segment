# CPU smoke test: tiny randomly initialised encoder, a few frames. Not for results.
base: base.yaml
experiment: smoke
output_dir: outputs
data:
  long_side: 256
  frames_per_video: 2
  val_frames_per_video: 2
  num_workers: 0
encoder:
  name: dinov3
  dtype: float32
  random_init: {hidden_size: 64, num_hidden_layers: 2, num_attention_heads: 4, intermediate_size: 128, patch_size: 16, num_register_tokens: 4}
model:
  kind: b1
  hidden: 64
  decoder_channels: [32, 16, 16, 8]
train:
  epochs: 2
  batch_size: 2
  warmup_steps: 2
  log_every: 1
eval:
  num_workers: 0
